name: Investigar falha de renderização
on:
  push:
    branches: [fix/investigar-erro-pagina]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx tsc --noEmit
      - run: bun run test
      - name: Executar SSR local e diagnosticar pagina inicial
        env:
          VITE_SUPABASE_URL: https://kyphgokrlvojxsngoysf.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_URL: https://kyphgokrlvojxsngoysf.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          (bun run dev -- --host 127.0.0.1 > /tmp/beneficio-debug.log 2>&1) &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8080/ -o /tmp/beneficio-response.html; then break; fi
            sleep 2
          done
          echo "HTTP RESPONSE:"
          curl -s -o /tmp/test-body -w 'HTTP %{http_code}\n' http://127.0.0.1:8080/ || true
          echo "HTML:"
          head -c 1200 /tmp/test-body || true
          echo "SERVER LOGS:"
          tail -n 170 /tmp/beneficio-debug.log || true
          test -f /tmp/test-body
          ! grep -q "This page didn't load" /tmp/test-body
