name: Diagnóstico de rotas públicas
on:
  push:
    branches: [feature/launch-price-runtime]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Testar páginas publicadas
        shell: bash
        run: |
          set -euo pipefail
          for path in "/" "/acesso" "/admin" "/minha-conta"; do
            code=$(curl -sSL --max-time 25 -o /tmp/beneficio.html -w '%{http_code}' "https://beneficio-compass-guide.lovable.app$path")
            echo "$path: HTTP $code"
            test "$code" = "200"
            ! grep -q "This page didn't load" /tmp/beneficio.html
          done
          grep -q "Projeto" /tmp/beneficio.html
      - name: Testar CORS do endpoint público (sem criar eventos)
        run: |
          status=$(curl -sS --max-time 20 -o /tmp/options -w '%{http_code}' -X OPTIONS \
            -H 'Origin: https://beneficio-compass-guide.lovable.app' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type,apikey' \
            'https://kyphgokrlvojxsngoysf.supabase.co/functions/v1/public-analytics')
          echo "Analytics CORS HTTP $status"
          test "$status" = "204"
