name: Beneficio Certo - Validacao
on:
  push:
    branches: [main, feature/acesso-asaas, feature/migracao-integral-seu-guia, feature/admin-dashboard]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          VITE_SUPABASE_URL: https://kyphgokrlvojxsngoysf.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_URL: https://kyphgokrlvojxsngoysf.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - run: bunx tsc --noEmit
      - run: bun run test
        env:
          VITE_SUPABASE_URL: https://kyphgokrlvojxsngoysf.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_URL: https://kyphgokrlvojxsngoysf.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
